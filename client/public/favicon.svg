<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="ballClip">
      <circle cx="50" cy="44" r="24"/>
    </clipPath>
  </defs>

  <g transform="translate(10,0)">
    <!-- Pin body: classic teardrop marker -->
    <path
      d="M50 6C28.5 6 11 23.2 11 44.3 11 74 50 112 50 112S89 74 89 44.3C89 23.2 71.5 6 50 6Z"
      fill="#e0342d"
      stroke="#a11f1f"
      stroke-width="2"
    />

    <!-- White ring around the ball -->
    <circle cx="50" cy="44" r="27" fill="#ffffff"/>

    <!-- Pétanque ball, dark gray -->
    <circle cx="50" cy="44" r="24" fill="#434343"/>

    <!-- Crossing double-line engraving, white on dark ball -->
    <g clip-path="url(#ballClip)" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round">
      <g transform="rotate(-45 50 44)">
        <path d="M45 16 Q64 44 45 72"/>
        <path d="M52 16 Q71 44 52 72"/>
      </g>
      <g transform="rotate(45 50 44)">
        <path d="M45 16 Q64 44 45 72"/>
        <path d="M52 16 Q71 44 52 72"/>
      </g>
    </g>
  </g>
</svg>
