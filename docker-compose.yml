services:
  db:
    platform: linux/amd64
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maboule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maboule}
      POSTGRES_DB: ${POSTGRES_DB:-maboule}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maboule} -d ${POSTGRES_DB:-maboule}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
